<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M Sabarinath – Ride through my portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@300;400;600&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#06020d;--vio:#8b5cf6;--ele:#a855f7;--mag:#e879f9;--crim:#ff2d6f;--text:#f3effc;--mut:#a79dc2;--line:rgba(196,181,253,.2);
--disp:'Anton','Impact',sans-serif;--body:'Sora',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:300 15.5px/1.6 var(--body);overflow:hidden;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;z-index:5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.7))}

/* loader */
#ld{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw;transition:opacity 1s,visibility 1s}
#ld.off{opacity:0;visibility:hidden}
#cnt{font:400 clamp(110px,28vw,300px)/1 var(--disp);background:linear-gradient(100deg,#ddd6fe,#a855f7 50%,#ff2d6f);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
#bar{width:min(320px,60vw);height:2px;background:var(--line);margin:8px 0 28px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ele),var(--crim));box-shadow:0 0 14px var(--ele)}
#go{padding:16px 54px;border-radius:999px;border:1px solid var(--mag);background:rgba(168,85,247,.14);font:400 22px var(--disp);letter-spacing:.2em;text-transform:uppercase;opacity:0;visibility:hidden;transition:.4s;box-shadow:0 0 40px rgba(168,85,247,.4)}
#go.on{opacity:1;visibility:visible}#go:hover{background:var(--crim);border-color:var(--crim);box-shadow:0 0 60px rgba(255,45,111,.6)}
#ld p{color:var(--mut);font-size:14px;margin:26px 0 0;max-width:420px}

/* hud */
.hud{position:fixed;z-index:10;pointer-events:none}
#brand{left:4vw;top:calc(16px + env(safe-area-inset-top,0px));font:400 26px var(--disp);letter-spacing:.06em}
#snd{right:4vw;top:calc(14px + env(safe-area-inset-top,0px));pointer-events:auto;background:rgba(10,5,20,.6);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13px;color:var(--mut)}
#spd{left:4vw;bottom:calc(86px + env(safe-area-inset-bottom,0px));font:400 54px/1 var(--disp);color:#fff;text-shadow:0 0 22px var(--ele)}#spd small{font:300 13px var(--body);color:var(--mut);margin-left:6px}
#nav{position:fixed;z-index:12;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;max-width:94vw;overflow-x:auto;padding:6px;border-radius:999px;background:rgba(10,5,20,.65);border:1px solid var(--line);backdrop-filter:blur(10px)}
#nav button{background:none;border:0;padding:8px 18px;border-radius:999px;color:var(--mut);font-size:14px;white-space:nowrap;transition:.25s}
#nav button:hover,#nav button.on{background:linear-gradient(100deg,var(--ele),var(--crim));color:#fff}
#wel{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;transition:opacity 1s;padding:0 5vw}
#wel h1{margin:0;font:400 clamp(60px,15vw,200px)/.9 var(--disp);text-transform:uppercase;background:linear-gradient(100deg,#ddd6fe,#a855f7 50%,#ff2d6f);-webkit-background-clip:text;background-clip:text;color:transparent;overflow:hidden}
#wel h1 span{display:inline-block;transform:translateY(110%);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
#wel.in h1 span{transform:none}
#wel p{color:var(--mut);margin:18px 0 0;opacity:0;transition:opacity 1s 1s}#wel.in p{opacity:1}
#wel.out{opacity:0}

/* panels */
.pn{position:fixed;z-index:11;right:4vw;top:50%;width:min(470px,90vw);max-height:70vh;overflow:auto;padding:30px;border-radius:20px;background:linear-gradient(160deg,rgba(28,14,52,.88),rgba(10,5,20,.9));border:1px solid rgba(232,121,249,.35);backdrop-filter:blur(14px);box-shadow:0 0 70px rgba(139,92,246,.3);
opacity:0;visibility:hidden;transform:translate(50px,-50%) scale(.96);transition:.55s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.pn.on{opacity:1;visibility:visible;transform:translate(0,-50%)}
.pn h2{font:400 46px/1 var(--disp);text-transform:uppercase;margin:0 0 14px;background:linear-gradient(100deg,#ddd6fe,#a855f7 55%,#ff2d6f);-webkit-background-clip:text;background-clip:text;color:transparent}
.pn h3{font:400 24px/1.1 var(--disp);text-transform:uppercase;margin:20px 0 4px;letter-spacing:.02em}
.pn p{margin:0 0 12px;color:#ddd5f1}.pn ul{margin:6px 0 12px;padding-left:18px;color:#d3cbe8}.pn li{margin-bottom:6px}
.pn .d{color:var(--mag);font-size:13px;margin:0 0 8px}
.pn img{width:100%;border-radius:8px;border:1px solid var(--line);margin:6px 0}
.pn .tg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pn .tg span{font-size:12.5px;padding:3px 12px;border:1px solid var(--line);border-radius:999px;color:#c4b5fd}
.pn a.l{text-underline-offset:5px;text-decoration-color:var(--crim);font-weight:600;margin-right:16px}
.st{display:flex;gap:30px;flex-wrap:wrap;margin-top:10px}.st b{display:block;font:400 44px/1 var(--disp);color:#fff}.st span{font-size:12.5px;color:var(--mut)}
.mail{display:inline-block;font:400 30px/1.1 var(--disp);text-decoration:none;border-bottom:3px solid var(--crim);padding-bottom:3px;word-break:break-all;margin:6px 0 18px}
#plain{display:none}
body.plain{overflow:auto;touch-action:auto}body.plain #plain{display:block;max-width:760px;margin:0 auto;padding:30px 6vw 90px;position:relative;z-index:3}
body.plain>.pn{display:none}body.plain #plain .pn{position:static;opacity:1;visibility:visible;transform:none;width:auto;max-height:none;margin-bottom:20px}
@media(max-width:760px){.pn{right:3vw;left:3vw;width:auto;top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-height:44vh;padding:22px;transform:translateY(30px)}.pn.on{transform:none}.pn h2{font-size:36px}#spd{font-size:40px;bottom:calc(76px + env(safe-area-inset-bottom,0px) + 44vh)}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

:root{--ink:#dff1ff;--vio:#2f9e44;--ele:#1f8ad4;--mag:#1f8ad4;--crim:#ff7a1a;--text:#10263d;--mut:#4d6b86;--line:rgba(16,38,61,.16)}
html,body{background:#8fd0ff;color:var(--text)}
.vig{background:radial-gradient(ellipse at center,transparent 62%,rgba(10,40,70,.25))}.grain{opacity:.03}
#ld{background:linear-gradient(#3f9ff2,#bfe3ff 72%,#eaf7ff)}
#cnt{background:linear-gradient(#fff,#d6efff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(20,90,160,.5))}
#bar{background:rgba(255,255,255,.5)}#bar i{background:linear-gradient(90deg,#2fb84f,#ffd23f);box-shadow:none}
#go{border-color:#fff;background:#2fb84f;color:#fff;box-shadow:0 10px 40px rgba(20,110,50,.45)}#go:hover{background:#ff7a1a;border-color:#fff;box-shadow:0 10px 40px rgba(200,90,10,.5)}
#ld p{color:#194a75}
#brand{color:#fff;text-shadow:0 2px 14px rgba(10,60,110,.6)}
#snd{background:rgba(255,255,255,.75);color:#194a75;border-color:rgba(16,38,61,.15)}
#spd{color:#fff;text-shadow:0 2px 16px rgba(10,60,110,.7)}#spd small{color:#e6f4ff}
#nav{background:rgba(255,255,255,.8);border-color:rgba(16,38,61,.12)}#nav button{color:#35597a}#nav button:hover,#nav button.on{background:#1f8ad4;color:#fff}

#wel p{color:#fff;text-shadow:0 1px 10px rgba(10,60,110,.8)}
#nx{position:fixed;z-index:12;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);padding:9px 22px;border-radius:999px;background:#fff;color:#10263d;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(10,60,110,.3);opacity:0;visibility:hidden;transition:.4s;pointer-events:none;white-space:nowrap}#nx.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
.pn{background:rgba(255,255,255,.9);border-color:#fff;box-shadow:0 20px 70px rgba(10,60,110,.35)}
.pn h2{background:linear-gradient(100deg,#1f8ad4,#2fb84f);-webkit-background-clip:text;background-clip:text;color:transparent}
.pn p,.pn ul{color:#1d3a55}.pn .d{color:#d9650d}.pn .tg span{color:#1f6fb0;border-color:rgba(16,38,61,.2)}
.st b{color:#10263d}.pn a.l{text-decoration-color:#ff7a1a}.mail{color:#10263d;border-color:#ff7a1a}
@media(max-width:760px){#nx{bottom:calc(76px + env(safe-area-inset-bottom,0px) + 44vh);font-size:13px}}
html{height:auto;overflow:visible}body{height:auto;overflow:visible;touch-action:auto}body.lock{overflow:hidden;height:100%}#sp{height:620vh}body.plain #sp{display:none}

#video-settings{position:fixed;z-index:30;left:16px;top:70px;width:min(290px,85vw);padding:12px 16px;background:rgba(255,255,255,.94);color:#194a75;border-radius:14px;box-shadow:0 8px 28px #194a7533;font:14px/1.5 sans-serif;touch-action:auto}
#video-settings summary{cursor:pointer;font-weight:600}#video-settings label{display:block;margin-top:12px}#video-settings input{display:block;max-width:100%;margin-top:5px}#video-settings button{margin-top:12px;padding:6px 12px;border:1px solid #b6d6e9;background:white;border-radius:8px;color:#194a75}#video-status{font-size:12px;margin:10px 0 0}

/* ===== retro pass ===== */
:root{--cr:#fff6df;--nv:#10263d;--bl:#1f8ad4;--or:#ff7a1a;--gr:#2fb84f;--ye:#ffd23f;--px:'Press Start 2P',monospace;--vt:'VT323',monospace}
#brand{font:400 14px var(--px);color:#fff;text-shadow:3px 3px 0 var(--nv);letter-spacing:0}
#snd,#nav button,#nx,#go{font-family:var(--px);font-size:10px;letter-spacing:0}
#snd{border-radius:0;border:3px solid var(--nv);background:var(--cr);color:var(--nv);box-shadow:3px 3px 0 var(--nv)}
#nav{border-radius:0;border:3px solid var(--nv);background:var(--cr);box-shadow:4px 4px 0 var(--nv);gap:4px}
#nav button{border-radius:0;color:var(--nv);padding:9px 14px}
#nav button:hover,#nav button.on{background:var(--or);color:#fff}
#nx{border-radius:0;border:3px solid var(--nv);box-shadow:4px 4px 0 var(--nv);background:var(--ye);padding:10px 16px}
#go{border-radius:0;border:4px solid var(--nv);box-shadow:6px 6px 0 var(--nv);font-size:18px;padding:18px 40px}
#spd{font:400 34px/1 var(--px);text-shadow:4px 4px 0 var(--nv)}#spd small{font:400 11px var(--px);color:#fff}
/* hero */
#wel .hero{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:960px}
#wel .badge{font:400 11px var(--px);background:var(--ye);color:var(--nv);border:3px solid var(--nv);box-shadow:4px 4px 0 var(--nv);padding:8px 14px;animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{background:var(--or);color:#fff}}
#wel h1{font:400 clamp(14px,5vw,56px)/1.15 var(--px);text-transform:none;white-space:nowrap;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#fff;filter:none;overflow:hidden;padding:8px 16px 22px 8px;text-shadow:4px 4px 0 var(--nv),8px 8px 0 var(--or)}
#wel .role{font:400 clamp(24px,3.2vw,38px)/1 var(--vt);color:#fff;text-shadow:2px 2px 0 var(--nv);opacity:0;transition:opacity .8s 1s}
#wel.in .role,#wel.in .chips,#wel.in .hs{opacity:1}
#wel .chips,#wel .hs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;opacity:0;transition:opacity .8s 1.3s}
#wel .chips b{font:400 clamp(18px,2vw,23px)/1 var(--vt);background:var(--cr);color:var(--nv);border:3px solid var(--nv);box-shadow:3px 3px 0 var(--nv);padding:5px 10px}
#wel .hs div{background:var(--nv);color:#fff;border:3px solid #fff;padding:8px 14px;text-align:center;font:400 10px var(--px)}
#wel .hs strong{display:block;color:var(--ye);font-size:18px;margin-bottom:6px}
#wel p{font:400 clamp(20px,2.2vw,26px)/1.1 var(--vt);margin-top:6px}
/* panels */
.pn{width:min(600px,92vw);max-height:78vh;padding:0;border-radius:0;background:var(--cr);border:4px solid var(--nv);box-shadow:8px 8px 0 var(--nv),8px 8px 0 4px var(--or);backdrop-filter:none;overflow:auto;transition:opacity .3s steps(5),transform .3s steps(5),visibility .3s;scrollbar-width:thin;scrollbar-color:var(--or) var(--cr)}
.pn::after{content:"";position:sticky;display:block;bottom:0;height:0;pointer-events:none}
.pn .tb{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;background:repeating-linear-gradient(90deg,var(--bl) 0 6px,#2a95e0 6px 12px);color:#fff;border-bottom:4px solid var(--nv);padding:8px 12px;font:400 10px var(--px)}
.pn .tb i{width:42px;height:12px;background:linear-gradient(90deg,var(--ye) 0 12px,transparent 12px 15px,var(--gr) 15px 27px,transparent 27px 30px,var(--or) 30px)}
.pn .bd{padding:18px 22px 20px;font:400 21px/1.08 var(--vt);position:relative;background-image:repeating-linear-gradient(0deg,rgba(16,38,61,.045) 0 2px,transparent 2px 4px)}
.pn h2{font:400 22px/1.2 var(--px);text-transform:none;margin:0 0 14px;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--nv);text-shadow:3px 3px 0 var(--ye)}
.pn h3{font:400 11px/1.5 var(--px);text-transform:none;color:var(--bl);margin:14px 0 4px}
.pn p,.pn ul{font:400 21px/1.08 var(--vt);color:var(--nv)}.pn ul{padding-left:20px;list-style:square}.pn li{margin-bottom:5px}
.pn .d{font:400 20px var(--vt);color:var(--or);margin:0 0 6px}
.pn img{border-radius:0;border:3px solid var(--nv);box-shadow:3px 3px 0 var(--nv);max-height:150px;object-fit:cover;object-position:top;margin:6px 0 8px;image-rendering:auto}
.pn .tg span{font:400 18px var(--vt);border-radius:0;border:2px solid var(--nv);background:var(--ye);color:var(--nv);padding:1px 8px}
.pn a.l{font:400 10px var(--px);text-decoration:none;display:inline-block;background:var(--nv);color:#fff;padding:9px 12px;margin:4px 8px 0 0;box-shadow:3px 3px 0 var(--or)}.pn a.l:hover{background:var(--or);box-shadow:3px 3px 0 var(--nv)}
.st{gap:10px;margin-top:12px}.st>div{flex:1 1 120px;background:var(--nv);border:3px solid var(--nv);padding:10px;text-align:center}
.st b{font:400 22px var(--px);color:var(--ye)}.st span{font:400 18px var(--vt);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font:400 20px/1.1 var(--vt)}.kv dt{color:var(--or)}.kv dd{margin:0}
.mail{font:400 14px/1.5 var(--px);border-bottom:4px solid var(--or);color:var(--nv);margin:8px 0 14px}
.tabs{display:flex;gap:4px;margin:0 0 12px;flex-wrap:wrap}.tabs button{font:400 9px var(--px);background:#fff;color:var(--nv);border:3px solid var(--nv);padding:8px 10px;border-radius:0}
.tabs button.on{background:var(--nv);color:var(--ye);box-shadow:3px 3px 0 var(--or)}
.tp{display:none}.tp.on{display:block}.tp>h3:first-child{margin-top:0}
body.plain .tp{display:block;margin-bottom:12px}body.plain .tabs{display:none}
@media(max-width:760px){.pn{max-height:46vh}.pn .bd{padding:14px 14px 16px}.pn h2{font-size:15px}.pn p,.pn ul,.pn .bd{font-size:19px}#wel h1{font-size:clamp(14px,5vw,40px);white-space:nowrap}#nav button{font-size:8px;padding:8px 9px}#spd{font-size:22px}}

/* ===== poster pass ===== */
#wel h1{color:#000;text-shadow:4px 4px 0 #fff,8px 8px 0 var(--or)}
.pn{left:50%;right:auto;top:50%;bottom:auto;width:min(640px,92vw);max-height:76vh;transform-origin:50% 50%;
transform:perspective(900px) translate(-50%,-50%) translateZ(-1500px) rotateX(40deg) rotateY(28deg) rotateZ(-24deg);
transition:transform .9s cubic-bezier(.16,1.15,.3,1),opacity .35s,visibility .9s}
.pn.on{transform:perspective(900px) translate(-50%,-50%) rotateZ(-1.2deg)}
.pn.past{transform:perspective(900px) translate(-50%,-50%) translateZ(650px) rotateY(-18deg) rotateZ(9deg);opacity:0;transition:transform .6s cubic-bezier(.5,0,1,.6),opacity .6s,visibility .6s}
.pn.on:hover{transform:perspective(900px) translate(-50%,-50%) rotateZ(0deg)}
@media(max-width:760px){.pn,.pn.on{left:50%;right:auto;top:48%;bottom:auto;width:94vw;max-height:72vh}#spd{bottom:calc(76px + env(safe-area-inset-bottom,0px))}#nx{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){.pn{transition-duration:.01ms!important}}

/* ===== intro line, bigger posters, blown-onto-face motion ===== */
#pre{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 6vw;pointer-events:none;opacity:0;transition:opacity .75s cubic-bezier(.22,1,.36,1)}
#pre.in{opacity:1}
#pre .intro-card{width:min(760px,90vw);padding:clamp(20px,5vw,46px);background:rgba(255,246,223,.96);border:4px solid var(--nv);box-shadow:8px 8px 0 var(--nv),8px 8px 0 12px var(--or);color:var(--nv);transform:translateY(10px);transition:transform .75s cubic-bezier(.22,1,.36,1)}
#pre.in .intro-card{transform:none}
#pre .intro-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;font:400 clamp(7px,1vw,10px)/1.5 var(--px);text-align:left}
#pre .intro-meta span:last-child{color:var(--bl)}
#pre .intro-title{display:block;margin:clamp(18px,3vw,28px) 0;font:400 clamp(22px,5.4vw,62px)/1.35 var(--px);letter-spacing:.02em;color:var(--nv);text-shadow:3px 3px 0 #fff,6px 6px 0 var(--or)}
#pre .intro-footer{display:flex;align-items:center;justify-content:center;gap:12px;font:400 clamp(7px,1vw,10px)/1.5 var(--px);color:var(--nv)}
#pre .intro-footer::before{content:"";width:32px;height:4px;background:var(--gr);box-shadow:3px 3px 0 var(--nv)}
.pn{width:min(780px,94vw);max-height:88vh}
.pn img{max-height:24vh;width:auto;max-width:100%;height:auto;object-fit:contain;display:block;margin:8px auto}
.pn.on{transform:perspective(900px) translate(-50%,-50%) rotateZ(-1.2deg);animation:blow 1.25s cubic-bezier(.2,.7,.3,1) both}
.pn.on:hover{transform:perspective(900px) translate(-50%,-50%) rotateZ(-1.2deg)}
@keyframes blow{
0%{transform:perspective(900px) translate(-50%,-50%) translateZ(-2200px) rotateX(38deg) rotateY(26deg) rotateZ(-34deg);opacity:0}
18%{opacity:1}
52%{transform:perspective(900px) translate(-50%,-50%) translateZ(140px) rotateX(-5deg) rotateY(-7deg) rotateZ(6deg)}
66%{transform:perspective(900px) translate(-50%,-50%) translateZ(-30px) rotateX(2deg) rotateY(3deg) rotateZ(-2.6deg)}
82%{transform:perspective(900px) translate(-50%,-50%) translateZ(12px) rotateZ(-.6deg)}
100%{transform:perspective(900px) translate(-50%,-50%) translateZ(0) rotateZ(-1.2deg);opacity:1}}
@media(max-width:760px){.pn img{max-height:15vh}}
@media(prefers-reduced-motion:reduce){.pn.on{animation:none}}
@keyframes pp{100%{opacity:1;transform:none;filter:none}}
#wel .role,#wel p{color:#0a1a2b;text-shadow:2px 2px 0 rgba(255,255,255,.9)}
#pre{transition:transform .75s cubic-bezier(.22,1,.36,1),filter .75s ease;transform:translateY(14px) scale(.97);filter:blur(8px)}
#pre.in{transform:none;filter:none}
#pre .intro-title span{display:inline-block;opacity:0;transform:translate3d(0,22px,0) rotateX(22deg) scale(.88);filter:blur(5px);transform-origin:center bottom}
#pre.show .intro-title span{animation:pp .85s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*45ms)}

{z:-250,t:'Experience',id:'experience',c:0x8b5cf6,h:'<h2>Experience</h2><h3>AI Research Intern</h3><p class="d">Karkaai Technologies · June – July 2026</p><ul><li>Studied research on generative AI in education and how blind, answer-dependent AI use affects learning compared with guided, tutor-style use.</li><li>Designed and compared tutor-bot prompts across three learner personas and built a 3-level hint ladder.</li><li>Red-teamed a basic tutor prompt with 3 prompt-injection attacks, all of which got the direct answer. A 4-layer prompt stack then kept the bot in tutoring mode in a small manual test.</li></ul><h3>Social Intern</h3><p class="d">Kismat Trust NGO · June – July 2025</p><ul><li>Promoted child education awareness by visiting schools, talking with teachers, running games and making posters.</li><li>Surveyed households on living conditions of local women and on awareness of technology and women’s rights.</li></ul><h3>Vice-President, Social Service Club</h3><p class="d">St. Kuriakose Public School · 2022 – 2023</p><ul><li>Led club initiatives and coordinated volunteer activities.</li></ul>'},
